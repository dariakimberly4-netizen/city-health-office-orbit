<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>City Health Office Orbit</title><style>:root{--c:#4fd1ff;--w:#f7fbff;--m:#a9bdd0}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,Arial;background:radial-gradient(circle at 50% 42%,#104f7b,#081d35 38%,#03101e 75%);color:var(--w);min-height:100vh}button,input,select{font:inherit}.screen{min-height:100vh}.loginScreen{display:grid;place-items:center;padding:20px}.login{width:min(94vw,500px);background:linear-gradient(145deg,#0c345a,#061a2e);border:1px solid #4fd1ff66;border-radius:28px;padding:28px;box-shadow:0 30px 90px #0008}.tag{color:var(--c);font-size:12px;font-weight:900;letter-spacing:.08em}.login h1{margin:8px 0}.login p{color:var(--m)}.login input,.login select{width:100%;margin-top:11px;padding:15px;border-radius:14px;border:1px solid #315a7d;background:#041525;color:white}.action{margin-top:13px;background:var(--c);color:#032039;border:0;border-radius:13px;padding:14px;font-weight:900;cursor:pointer}.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}.quick button{min-height:58px;border-radius:14px;border:1px solid #4fd1ff70;background:#0d416f;color:white;font-weight:900;cursor:pointer}.quick button:hover{border-color:var(--c)}.hint{margin-top:15px;padding:14px;background:#ffffff0b;border-radius:14px;color:#a9bdd0;font-size:13px}.error{color:#ff9a9a;font-weight:800;margin-top:10px}.top{display:flex;justify-content:space-between;align-items:center;padding:18px 24px;gap:12px}.brand{font-weight:900;letter-spacing:.08em}.userbar{display:flex;align-items:center;gap:10px;color:#a9bdd0}.logout,.back{border:1px solid #466984;background:#0d416f;color:white;border-radius:12px;padding:10px 13px;font-weight:800;cursor:pointer}.orbitScreen{display:none}.orbit-wrap{min-height:calc(100vh - 76px);display:grid;place-items:center;padding:12px 12px 36px}.orbit{position:relative;width:min(88vw,720px);aspect-ratio:1}.ring{position:absolute;inset:12%;border:1px solid #4fd1ff61;border-radius:50%;pointer-events:none}.ring:after{content:"";position:absolute;inset:15%;border:1px dashed #ffffff24;border-radius:50%}.center,.node{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);border:1px solid #4fd1ff80;background:linear-gradient(145deg,#0d3f6af7,#051c33f7);color:white;box-shadow:0 10px 35px #0006;cursor:pointer;z-index:3}.center{width:31%;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;text-align:center;padding:16px;font-weight:900}.center small{color:var(--c)}.node{width:23%;min-height:72px;border-radius:18px;padding:10px;text-align:center;font-weight:800;font-size:13px}.n1{left:50%;top:6%}.n2{left:81%;top:19%}.n3{left:94%;top:50%}.n4{left:81%;top:81%}.n5{left:50%;top:94%}.n6{left:19%;top:81%}.n7{left:6%;top:50%}.n8{left:19%;top:19%}.workspace{display:none;min-height:100vh;padding:20px}.head,.grid,.form{max-width:1100px;margin:18px auto}.head h1{font-size:clamp(27px,5vw,46px)}.head p{color:var(--m)}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card,.form{background:#0a2846dd;border:1px solid #4fd1ff3d;border-radius:20px;padding:18px}.metric{font-size:30px;font-weight:900;color:var(--c)}.fields{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.fields input,.fields select{width:100%;background:#061a2e;color:white;border:1px solid #315a7d;border-radius:12px;padding:12px}@media(max-width:720px){.top{padding:13px}.orbit{width:96vw}.node{width:27%;min-height:62px;font-size:10px;padding:7px}.center{width:34%;font-size:12px}.n3{left:91%}.n7{left:9%}.grid,.fields{grid-template-columns:1fr}.userbar{font-size:11px}.quick{grid-template-columns:1fr}}</style></head><body><section id="loginScreen" class="screen loginScreen"><div class="login"><div class="tag">CITY HEALTH OFFICE • AUTHORIZED ACCESS</div><h1>Login to City Health Orbit</h1><p>Choose a role, or use a one-tap demo login.</p><div class="quick"><button onclick="demoLogin('admin')">👤 USE ADMIN LOGIN</button><button onclick="demoLogin('staff')">👥 USE STAFF LOGIN</button></div><select id="role"><option value="admin">City Health Admin</option><option value="staff">Employee / Staff</option></select><input id="username" placeholder="Username" autocomplete="username"><input id="password" type="password" placeholder="Password" autocomplete="current-password"><button class="action" style="width:100%" onclick="login()">LOGIN TO ORBIT</button><div id="loginError" class="error"></div><div class="hint"><b>Admin:</b> <span id="adminU">admin</span> / <span id="adminP">CHO2026</span><br><button onclick="copyText('admin')">COPY ADMIN USERNAME</button> <button onclick="copyText('CHO2026')">COPY ADMIN PASSWORD</button><br><br><b>Staff:</b> <span>staff</span> / <span>Health2026</span><br><button onclick="copyText('staff')">COPY STAFF USERNAME</button> <button onclick="copyText('Health2026')">COPY STAFF PASSWORD</button><br><br><span id="copyMsg"></span></div></div></section><section id="orbitScreen" class="screen orbitScreen"><header class="top"><div><div class="brand">CITY HEALTH OFFICE</div><div class="tag">CARE OPERATIONS ORBIT</div></div><div class="userbar"><span id="orbitWho"></span><button class="logout" onclick="logout()">LOG OUT</button></div></header><main class="orbit-wrap"><div class="orbit"><div class="ring"></div><button class="center" onclick="openModule('command')">CITY HEALTH<br>COMMAND CENTER<small>OPEN</small></button><button class="node n1" onclick="openModule('visits')">HOME-VISIT<br>PLANNER</button><button class="node n2" onclick="openModule('referrals')">REFERRAL<br>TRACKING</button><button class="node n3" onclick="openModule('immunization')">IMMUNIZATION<br>FOLLOW-UP</button><button class="node n4" onclick="openModule('senior')">SENIOR & PWD<br>MONITORING</button><button class="node n5" onclick="openModule('medicine')">MEDICINE<br>DISTRIBUTION</button><button class="node n6" onclick="openModule('alerts')">EMERGENCY<br>ALERTS</button><button class="node n7" onclick="openModule('reports')">CITY HEALTH<br>REPORTS</button><button class="node n8" onclick="openModule('activity')">TODAY'S LOCAL<br>CARE ACTIVITY</button></div></main></section><section id="workspace" class="workspace"><div class="top"><button class="back" onclick="backToOrbit()">← BACK TO ORBIT</button><div class="userbar"><span id="who"></span><button class="logout" onclick="logout()">LOG OUT</button></div></div><div class="head"><div class="tag">CITY HEALTH OFFICE</div><h1 id="moduleTitle"></h1><p id="moduleDesc"></p></div><div id="moduleContent"></div></section><script>const modules={command:['City Health Command Center','One operational view of local care work.',['Visits Today','Open Referrals','Follow-ups Due','Medicine Releases','Emergency Alerts','Reports Pending']],visits:['Home-Visit Planner','Plan, record and follow up household and patient visits.',['Visits Today','Scheduled','Completed','Needs Follow-up']],referrals:['Referral Tracking','Track referrals from creation through receiving facility and outcome.',['New Referrals','In Transit','Received','Needs Follow-up']],immunization:['Immunization Follow-Up','Track due, missed and completed immunization follow-ups.',['Due Today','Overdue','Completed','Next 7 Days']],senior:['Senior & PWD Monitoring','Maintain care follow-ups for senior citizens and persons with disabilities.',['Active Monitoring','Homebound','Due Visit','Needs Assistance']],medicine:['Medicine Distribution Log','Record medicine releases and monitor remaining local stock activity.',['Released Today','Recipients','Low Stock','Pending Release']],alerts:['Emergency Alerts','Record urgent local health incidents and escalation status.',['Active Alerts','Acknowledged','Dispatched','Resolved']],reports:['City Health Reports','Prepare and track operational city health reports.',['Draft','For Review','Submitted','Returned']],activity:["Today's Local Care Activity",'See the current local care workload and recently recorded actions.',['New Today','In Progress','Completed','Follow-up']]};let currentUser=null;function demoLogin(r){role.value=r;if(r==='admin'){username.value='admin';password.value='CHO2026'}else{username.value='staff';password.value='Health2026'}login()}async function copyText(t){try{await navigator.clipboard.writeText(t);copyMsg.textContent='Copied ✓'}catch(e){copyMsg.textContent='Select and copy: '+t}}function login(){const r=role.value,u=username.value.trim(),p=password.value;let ok=(r==='admin'&&u==='admin'&&p==='CHO2026')||(r==='staff'&&u==='staff'&&p==='Health2026');if(!ok){loginError.textContent='Incorrect login. Check role, username and password.';return}currentUser={role:r,name:r==='admin'?'City Health Admin':'Employee / Staff'};loginError.textContent='';username.value='';password.value='';loginScreen.style.display='none';orbitScreen.style.display='block';orbitWho.textContent=currentUser.name}function logout(){currentUser=null;workspace.style.display='none';orbitScreen.style.display='none';loginScreen.style.display='grid';scrollTo(0,0)}function key(m){return'cho_'+m+'_records'}function records(m){try{return JSON.parse(localStorage.getItem(key(m))||'[]')}catch(e){return[]}}function openModule(m){if(!currentUser){logout();return}const [title,desc,stats]=modules[m];orbitScreen.style.display='none';workspace.style.display='block';workspace.dataset.module=m;moduleTitle.textContent=title;moduleDesc.textContent=desc;who.textContent=currentUser.name;render(m,stats);scrollTo(0,0)}function render(m,stats){const rs=records(m);let cards='<div class="grid">'+stats.map((s,i)=>`<div class="card"><h3>${s}</h3><div class="metric">${i===0?rs.length:Math.max(0,rs.length-i)}</div><div style="color:#9db4c8">Local records</div></div>`).join('')+'</div>';let form=`<div class="form"><h2>Add Record</h2><div class="fields"><input id="person" placeholder="Patient / resident / subject"><input id="detail" placeholder="Details / location / facility"><select id="status"><option>Pending</option><option>Scheduled</option><option>In Progress</option><option>Completed</option><option>Needs Follow-up</option></select><input id="date" type="date"></div><button class="action" onclick="saveRecord()">SAVE RECORD</button><div id="recent"></div></div>`;moduleContent.innerHTML=cards+form;showRecent(m)}function saveRecord(){const m=workspace.dataset.module,r={person:person.value||'Untitled',detail:detail.value,status:status.value,date:date.value||new Date().toISOString().slice(0,10)};const rs=records(m);rs.unshift(r);localStorage.setItem(key(m),JSON.stringify(rs));render(m,modules[m][2])}function showRecent(m){const rs=records(m).slice(0,5);recent.innerHTML=rs.length?'<h3>Recent Records</h3>'+rs.map(r=>`<div style="padding:12px 0;border-top:1px solid #244967"><b>${esc(r.person)}</b> · ${esc(r.status)}<br><small style="color:#9db4c8">${esc(r.detail||'No details')} · ${r.date}</small></div>`).join(''):'<p style="color:#8fa9bf">No records yet.</p>'}function esc(s){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','>':'&gt;','"':'&quot;'}[c]))}function backToOrbit(){workspace.style.display='none';orbitScreen.style.display='block';orbitWho.textContent=currentUser.name;scrollTo(0,0)}</script></body></html>
