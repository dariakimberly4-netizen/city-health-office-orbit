<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>City Health Office Orbit</title>
<style>
:root{--navy:#071b33;--blue:#0b3f70;--cyan:#4fd1ff;--white:#f7fbff;--muted:#a9bdd0;--panel:#0b2948;--green:#4de0a8;--gold:#ffd66b}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,Arial,sans-serif;background:radial-gradient(circle at 50% 42%,#104f7b 0,#081d35 34%,#03101e 72%);color:var(--white);min-height:100vh}button,input,select,textarea{font:inherit}.screen{min-height:100vh}.top{display:flex;justify-content:space-between;align-items:center;padding:18px 24px;gap:12px}.brand{font-weight:900;letter-spacing:.08em}.tag{color:var(--cyan);font-size:12px;font-weight:800}.orbit-wrap{min-height:calc(100vh - 76px);display:grid;place-items:center;padding:12px 12px 36px}.orbit{position:relative;width:min(88vw,720px);aspect-ratio:1}.ring{position:absolute;inset:12%;border:1px solid rgba(79,209,255,.38);border-radius:50%;box-shadow:0 0 50px rgba(79,209,255,.12) inset}.ring:after{content:"";position:absolute;inset:15%;border:1px dashed rgba(255,255,255,.14);border-radius:50%}.center,.node{border:1px solid rgba(79,209,255,.5);background:linear-gradient(145deg,rgba(13,63,106,.97),rgba(5,28,51,.97));color:white;box-shadow:0 10px 35px rgba(0,0,0,.35),0 0 18px rgba(79,209,255,.12);cursor:pointer;transition:.18s transform,.18s border-color}.center:hover,.node:hover,.center:focus,.node:focus{transform:translate(-50%,-50%) scale(1.045);border-color:var(--cyan);outline:none}.center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:31%;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;text-align:center;padding:16px;font-weight:900;z-index:3}.center small{display:block;color:var(--cyan);margin-top:7px}.node{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:23%;min-height:72px;border-radius:18px;padding:10px;text-align:center;font-weight:800;font-size:13px;z-index:4}.n1{left:50%;top:6%}.n2{left:81%;top:19%}.n3{left:94%;top:50%}.n4{left:81%;top:81%}.n5{left:50%;top:94%}.n6{left:19%;top:81%}.n7{left:6%;top:50%}.n8{left:19%;top:19%}.workspace{display:none;min-height:100vh;padding:20px}.workspace.active{display:block}.back{background:#0d416f;color:white;border:1px solid #3b82b6;border-radius:14px;padding:12px 16px;font-weight:800;cursor:pointer}.head{max-width:1100px;margin:22px auto}.head h1{font-size:clamp(26px,5vw,46px);margin:12px 0 6px}.head p{color:var(--muted)}.grid{max-width:1100px;margin:auto;display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{background:rgba(10,40,70,.86);border:1px solid rgba(79,209,255,.24);border-radius:20px;padding:18px;min-height:130px}.card h3{margin:0 0 8px}.metric{font-size:30px;font-weight:900;color:var(--cyan)}.action{margin-top:12px;background:var(--cyan);color:#032039;border:0;border-radius:12px;padding:11px 14px;font-weight:900;cursor:pointer}.form{max-width:1100px;margin:16px auto;background:rgba(10,40,70,.75);padding:18px;border-radius:20px;border:1px solid rgba(79,209,255,.2)}.fields{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.fields input,.fields select,.fields textarea{width:100%;background:#061a2e;color:white;border:1px solid #315a7d;border-radius:12px;padding:12px}.saved{color:var(--green);font-weight:800;margin-left:10px}.footer{text-align:center;color:#7895ae;padding:24px;font-size:12px}@media(max-width:720px){.top{padding:14px}.orbit{width:96vw}.node{width:27%;min-height:62px;font-size:10px;padding:7px;border-radius:14px}.center{width:34%;font-size:12px;padding:9px}.n1{top:5%}.n3{left:91%}.n5{top:95%}.n7{left:9%}.grid{grid-template-columns:1fr}.fields{grid-template-columns:1fr}.workspace{padding:14px}.head{margin-top:16px}}
</style>
</head>
<body>
<section id="home" class="screen">
<header class="top"><div><div class="brand">CITY HEALTH OFFICE</div><div class="tag">CARE OPERATIONS ORBIT</div></div><div class="tag">LOCAL-FIRST • SUPABASE READY</div></header>
<main class="orbit-wrap"><div class="orbit"><div class="ring"></div>
<button class="center" onclick="openModule('command')">CITY HEALTH<br>COMMAND CENTER<small>OPEN</small></button>
<button class="node n1" onclick="openModule('visits')">HOME-VISIT<br>PLANNER</button><button class="node n2" onclick="openModule('referrals')">REFERRAL<br>TRACKING</button><button class="node n3" onclick="openModule('immunization')">IMMUNIZATION<br>FOLLOW-UP</button><button class="node n4" onclick="openModule('senior')">SENIOR & PWD<br>MONITORING</button><button class="node n5" onclick="openModule('medicine')">MEDICINE<br>DISTRIBUTION</button><button class="node n6" onclick="openModule('alerts')">EMERGENCY<br>ALERTS</button><button class="node n7" onclick="openModule('reports')">CITY HEALTH<br>REPORTS</button><button class="node n8" onclick="openModule('activity')">TODAY'S LOCAL<br>CARE ACTIVITY</button>
</div></main></section>
<section id="workspace" class="workspace"><button class="back" onclick="backToOrbit()">← BACK TO ORBIT</button><div class="head"><div class="tag">CITY HEALTH OFFICE</div><h1 id="moduleTitle"></h1><p id="moduleDesc"></p></div><div id="moduleContent"></div><div class="footer">City Health Office Orbit • browser-local working prototype • backend connection can be added later</div></section>
<script>
const modules={
command:['City Health Command Center','One operational view of local care work.',['Visits Today','Open Referrals','Follow-ups Due','Medicine Releases','Emergency Alerts','Reports Pending']],
visits:['Home-Visit Planner','Plan, record and follow up household and patient visits.',['Visits Today','Scheduled','Completed','Needs Follow-up']],
referrals:['Referral Tracking','Track referrals from creation through receiving facility and outcome.',['New Referrals','In Transit','Received','Needs Follow-up']],
immunization:['Immunization Follow-Up','Track due, missed and completed immunization follow-ups.',['Due Today','Overdue','Completed','Next 7 Days']],
senior:['Senior & PWD Monitoring','Maintain care follow-ups for senior citizens and persons with disabilities.',['Active Monitoring','Homebound','Due Visit','Needs Assistance']],
medicine:['Medicine Distribution Log','Record medicine releases and monitor remaining local stock activity.',['Released Today','Recipients','Low Stock','Pending Release']],
alerts:['Emergency Alerts','Record urgent local health incidents and escalation status.',['Active Alerts','Acknowledged','Dispatched','Resolved']],
reports:['City Health Reports','Prepare and track operational barangay and city health reports.',['Draft','For Review','Submitted','Returned']],
activity:["Today's Local Care Activity",'See the current local care workload and recently recorded actions.',['New Today','In Progress','Completed','Follow-up']]
};
function key(m){return 'cho_'+m+'_records'}function records(m){try{return JSON.parse(localStorage.getItem(key(m))||'[]')}catch(e){return[]}}
function openModule(m){const [title,desc,stats]=modules[m];document.getElementById('home').style.display='none';const w=document.getElementById('workspace');w.classList.add('active');w.dataset.module=m;document.getElementById('moduleTitle').textContent=title;document.getElementById('moduleDesc').textContent=desc;render(m,stats);scrollTo(0,0)}
function render(m,stats){const rs=records(m);let cards='<div class="grid">'+stats.map((s,i)=>`<div class="card"><h3>${s}</h3><div class="metric">${i===0?rs.length:Math.max(0,rs.length-i)}</div><div style="color:#9db4c8">Live local records</div></div>`).join('')+'</div>';let form=`<div class="form"><h2>Add ${m==='command'?'Operational Note':'Record'}</h2><div class="fields"><input id="person" placeholder="Patient / resident / subject"><input id="detail" placeholder="Details / location / facility"><select id="status"><option>Pending</option><option>Scheduled</option><option>In Progress</option><option>Completed</option><option>Needs Follow-up</option></select><input id="date" type="date"></div><button class="action" onclick="saveRecord()">SAVE RECORD</button><span id="saved" class="saved"></span><div id="recent"></div></div>`;document.getElementById('moduleContent').innerHTML=cards+form;showRecent(m)}
function saveRecord(){const m=document.getElementById('workspace').dataset.module;const r={person:person.value||'Untitled',detail:detail.value,status:status.value,date:date.value||new Date().toISOString().slice(0,10),time:new Date().toLocaleTimeString()};const rs=records(m);rs.unshift(r);localStorage.setItem(key(m),JSON.stringify(rs));saved.textContent='Saved ✓';render(m,modules[m][2])}
function showRecent(m){const rs=records(m).slice(0,5),el=document.getElementById('recent');if(!rs.length){el.innerHTML='<p style="color:#8fa9bf;margin-top:18px">No records yet.</p>';return}el.innerHTML='<h3 style="margin-top:22px">Recent Records</h3>'+rs.map(r=>`<div style="padding:12px 0;border-top:1px solid #244967"><b>${escapeHtml(r.person)}</b> · ${escapeHtml(r.status)}<br><small style="color:#9db4c8">${escapeHtml(r.detail||'No details')} · ${r.date}</small></div>`).join('')}
function escapeHtml(s){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function backToOrbit(){document.getElementById('workspace').classList.remove('active');document.getElementById('home').style.display='block';scrollTo(0,0)}
</script></body></html>
