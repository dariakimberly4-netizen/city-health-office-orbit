<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>City Health Office Orbit</title><style>
:root{--cyan:#4fd1ff;--white:#f7fbff;--muted:#a9bdd0;--green:#4de0a8}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,Arial,sans-serif;background:radial-gradient(circle at 50% 42%,#104f7b 0,#081d35 34%,#03101e 72%);color:var(--white);min-height:100vh}button,input,select{font:inherit}.screen{min-height:100vh}.top{display:flex;justify-content:space-between;align-items:center;padding:18px 24px}.brand{font-weight:900;letter-spacing:.08em}.tag{color:var(--cyan);font-size:12px;font-weight:800}.orbit-wrap{min-height:calc(100vh - 76px);display:grid;place-items:center;padding:12px 12px 36px}.orbit{position:relative;width:min(88vw,720px);aspect-ratio:1}.ring{position:absolute;inset:12%;border:1px solid rgba(79,209,255,.38);border-radius:50%;box-shadow:0 0 50px rgba(79,209,255,.12) inset}.ring:after{content:"";position:absolute;inset:15%;border:1px dashed rgba(255,255,255,.14);border-radius:50%}.center,.node{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);border:1px solid rgba(79,209,255,.5);background:linear-gradient(145deg,rgba(13,63,106,.97),rgba(5,28,51,.97));color:white;box-shadow:0 10px 35px #0006;cursor:pointer}.center{width:31%;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;text-align:center;padding:16px;font-weight:900}.center small{color:var(--cyan)}.node{width:23%;min-height:72px;border-radius:18px;padding:10px;text-align:center;font-weight:800;font-size:13px}.n1{left:50%;top:6%}.n2{left:81%;top:19%}.n3{left:94%;top:50%}.n4{left:81%;top:81%}.n5{left:50%;top:94%}.n6{left:19%;top:81%}.n7{left:6%;top:50%}.n8{left:19%;top:19%}.workspace{display:none;min-height:100vh;padding:20px}.workspace.active{display:block}.back{background:#0d416f;color:white;border:1px solid #3b82b6;border-radius:14px;padding:12px 16px;font-weight:800;cursor:pointer}.head,.form,.grid{max-width:1100px;margin:18px auto}.head h1{font-size:clamp(26px,5vw,46px)}.head p{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card,.form{background:#0a2846dd;border:1px solid #4fd1ff3d;border-radius:20px;padding:18px}.metric{font-size:30px;font-weight:900;color:var(--cyan)}.fields{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.fields input,.fields select{width:100%;background:#061a2e;color:white;border:1px solid #315a7d;border-radius:12px;padding:12px}.action{margin-top:12px;background:var(--cyan);color:#032039;border:0;border-radius:12px;padding:11px 14px;font-weight:900;cursor:pointer}.modal{display:none;position:fixed;inset:0;background:#020b14eF;z-index:50;place-items:center;padding:18px}.modal.active{display:grid}.login{width:min(94vw,480px);background:linear-gradient(145deg,#0c345a,#061a2e);border:1px solid #4fd1ff66;border-radius:26px;padding:26px;box-shadow:0 30px 90px #000}.login h2{margin:5px 0}.login input,.login select{width:100%;margin-top:10px;padding:14px;border-radius:13px;border:1px solid #315a7d;background:#041525;color:white}.hint{margin-top:18px;padding:13px;border-radius:14px;background:#ffffff0c;color:#a9bdd0;font-size:13px}.error{color:#ff9a9a;font-weight:800;margin-top:10px}.userbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;color:#a9bdd0}.logout{border:1px solid #466984;background:transparent;color:white;border-radius:10px;padding:8px 11px;cursor:pointer}@media(max-width:720px){.orbit{width:96vw}.node{width:27%;min-height:62px;font-size:10px}.center{width:34%;font-size:12px}.n3{left:91%}.n7{left:9%}.grid,.fields{grid-template-columns:1fr}}
</style></head><body>
<section id="home" class="screen"><header class="top"><div><div class="brand">CITY HEALTH OFFICE</div><div class="tag">CARE OPERATIONS ORBIT</div></div><div class="tag">ORBIT FIRST</div></header><main class="orbit-wrap"><div class="orbit"><div class="ring"></div><button class="center" onclick="requestModule('command')">CITY HEALTH<br>COMMAND CENTER<small>OPEN</small></button><button class="node n1" onclick="requestModule('visits')">HOME-VISIT<br>PLANNER</button><button class="node n2" onclick="requestModule('referrals')">REFERRAL<br>TRACKING</button><button class="node n3" onclick="requestModule('immunization')">IMMUNIZATION<br>FOLLOW-UP</button><button class="node n4" onclick="requestModule('senior')">SENIOR & PWD<br>MONITORING</button><button class="node n5" onclick="requestModule('medicine')">MEDICINE<br>DISTRIBUTION</button><button class="node n6" onclick="requestModule('alerts')">EMERGENCY<br>ALERTS</button><button class="node n7" onclick="requestModule('reports')">CITY HEALTH<br>REPORTS</button><button class="node n8" onclick="requestModule('activity')">TODAY'S LOCAL<br>CARE ACTIVITY</button></div></main></section>
<div id="loginModal" class="modal"><div class="login"><div class="tag">AUTHORIZED ACCESS</div><h2>City Health Login</h2><p style="color:#a9bdd0">Sign in to open <b id="targetName"></b>.</p><select id="role"><option value="admin">City Health Admin</option><option value="staff">Employee / Staff</option></select><input id="username" autocomplete="username" placeholder="Username"><input id="password" type="password" autocomplete="current-password" placeholder="Password"><button class="action" style="width:100%;padding:14px" onclick="login()">LOGIN & OPEN</button><div id="loginError" class="error"></div><div class="hint"><b>Demo Admin:</b> admin / CHO2026<br><b>Demo Staff:</b> staff / Health2026<br><br>This is demo access only. Real secure accounts will use Supabase later.</div><button class="logout" style="margin-top:14px" onclick="closeLogin()">CANCEL</button></div></div>
<section id="workspace" class="workspace"><div style="display:flex;justify-content:space-between;gap:12px;align-items:center"><button class="back" onclick="backToOrbit()">← BACK TO ORBIT</button><div class="userbar"><span id="who"></span><button class="logout" onclick="logout()">LOG OUT</button></div></div><div class="head"><div class="tag">CITY HEALTH OFFICE</div><h1 id="moduleTitle"></h1><p id="moduleDesc"></p></div><div id="moduleContent"></div></section>
<script>
const modules={command:['City Health Command Center','One operational view of local care work.',['Visits Today','Open Referrals','Follow-ups Due','Medicine Releases','Emergency Alerts','Reports Pending']],visits:['Home-Visit Planner','Plan, record and follow up household and patient visits.',['Visits Today','Scheduled','Completed','Needs Follow-up']],referrals:['Referral Tracking','Track referrals from creation through receiving facility and outcome.',['New Referrals','In Transit','Received','Needs Follow-up']],immunization:['Immunization Follow-Up','Track due, missed and completed immunization follow-ups.',['Due Today','Overdue','Completed','Next 7 Days']],senior:['Senior & PWD Monitoring','Maintain care follow-ups for senior citizens and persons with disabilities.',['Active Monitoring','Homebound','Due Visit','Needs Assistance']],medicine:['Medicine Distribution Log','Record medicine releases and monitor remaining local stock activity.',['Released Today','Recipients','Low Stock','Pending Release']],alerts:['Emergency Alerts','Record urgent local health incidents and escalation status.',['Active Alerts','Acknowledged','Dispatched','Resolved']],reports:['City Health Reports','Prepare and track operational barangay and city health reports.',['Draft','For Review','Submitted','Returned']],activity:["Today's Local Care Activity",'See the current local care workload and recently recorded actions.',['New Today','In Progress','Completed','Follow-up']]};
let pending=null,currentUser=null;function requestModule(m){pending=m;if(currentUser){openModule(m);return}targetName.textContent=modules[m][0];loginModal.classList.add('active');username.focus()}function closeLogin(){loginModal.classList.remove('active');loginError.textContent='';pending=null}function login(){const r=role.value,u=username.value.trim(),p=password.value;const ok=(r==='admin'&&u==='admin'&&p==='CHO2026')||(r==='staff'&&u==='staff'&&p==='Health2026');if(!ok){loginError.textContent='Incorrect demo login. Please check role, username and password.';return}currentUser={role:r,name:r==='admin'?'City Health Admin':'Employee / Staff'};loginModal.classList.remove('active');username.value='';password.value='';openModule(pending)}function logout(){currentUser=null;backToOrbit()}function key(m){return'cho_'+m+'_records'}function records(m){try{return JSON.parse(localStorage.getItem(key(m))||'[]')}catch(e){return[]}}function openModule(m){const [title,desc,stats]=modules[m];home.style.display='none';workspace.classList.add('active');workspace.dataset.module=m;moduleTitle.textContent=title;moduleDesc.textContent=desc;who.textContent='Signed in: '+currentUser.name;render(m,stats);scrollTo(0,0)}function render(m,stats){const rs=records(m);let cards='<div class="grid">'+stats.map((s,i)=>`<div class="card"><h3>${s}</h3><div class="metric">${i===0?rs.length:Math.max(0,rs.length-i)}</div><div style="color:#9db4c8">Local records</div></div>`).join('')+'</div>';let form=`<div class="form"><h2>Add Record</h2><div class="fields"><input id="person" placeholder="Patient / resident / subject"><input id="detail" placeholder="Details / location / facility"><select id="status"><option>Pending</option><option>Scheduled</option><option>In Progress</option><option>Completed</option><option>Needs Follow-up</option></select><input id="date" type="date"></div><button class="action" onclick="saveRecord()">SAVE RECORD</button><div id="recent"></div></div>`;moduleContent.innerHTML=cards+form;showRecent(m)}function saveRecord(){const m=workspace.dataset.module,r={person:person.value||'Untitled',detail:detail.value,status:status.value,date:date.value||new Date().toISOString().slice(0,10)};const rs=records(m);rs.unshift(r);localStorage.setItem(key(m),JSON.stringify(rs));render(m,modules[m][2])}function showRecent(m){const rs=records(m).slice(0,5);recent.innerHTML=rs.length?'<h3>Recent Records</h3>'+rs.map(r=>`<div style="padding:12px 0;border-top:1px solid #244967"><b>${esc(r.person)}</b> · ${esc(r.status)}<br><small style="color:#9db4c8">${esc(r.detail||'No details')} · ${r.date}</small></div>`).join(''):'<p style="color:#8fa9bf">No records yet.</p>'}function esc(s){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}function backToOrbit(){workspace.classList.remove('active');home.style.display='block';scrollTo(0,0)}
</script></body></html>
